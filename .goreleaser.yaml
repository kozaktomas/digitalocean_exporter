version: 2

project_name: digitalocean_exporter

# No before-hooks on purpose. `go mod tidy` here would rewrite go.mod and go.sum on
# the release runner, after every check has passed, and build a module graph nobody
# reviewed. CI checks that the commit is already tidy instead.

builds:
  - id: digitalocean_exporter
    main: ./cmd/digitalocean_exporter
    binary: digitalocean_exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kozaktomas/digitalocean_exporter/internal/version.Version={{.Version}}
      - -X github.com/kozaktomas/digitalocean_exporter/internal/version.Commit={{.ShortCommit}}

archives:
  - id: tarball
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE

nfpms:
  # Debian rejects underscores in package names, so the package is
  # digitalocean-exporter while the binary keeps the Prometheus convention.
  - id: deb
    package_name: digitalocean-exporter
    vendor: Tomas Kozak
    homepage: https://github.com/kozaktomas/digitalocean_exporter
    maintainer: Tomas Kozak <kozak@talko.cz>
    description: |
      Prometheus exporter for DigitalOcean. Exposes account, billing and
      infrastructure metrics collected from the DigitalOcean API.
    license: Apache-2.0
    section: net
    priority: optional
    bindir: /usr/bin
    formats:
      - deb
    file_name_template: 'digitalocean-exporter_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    dependencies:
      - ca-certificates
    contents:
      - src: deb/digitalocean-exporter.service
        dst: /lib/systemd/system/digitalocean-exporter.service
      - src: deb/digitalocean-exporter.env
        dst: /etc/digitalocean-exporter/digitalocean-exporter.env
        type: config|noreplace
    scripts:
      postinstall: deb/postinstall.sh
      preremove: deb/preremove.sh
      postremove: deb/postremove.sh

# One SBOM per archive, written by syft and attached to the release beside it.
# The default document name keeps the convention readers expect: <archive>.sbom.json.
sboms:
  - artifacts: archive

# Keyless cosign signatures: no key to store or leak. The certificate binds each
# signature to the release workflow's OIDC identity, and the transparency log entry
# to the moment it ran. `make snapshot` passes --skip=sign when no OIDC token is in
# the environment, so a local dry run needs no signing identity — and no cosign.
signs:
  - id: archives
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - --yes
      - ${artifact}
  # The checksums file is the one most people verify, so it carries its own
  # signature: one verified file then vouches for every artifact it lists.
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - --yes
      - ${artifact}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  # The chart is packaged by the release workflow before goreleaser runs. Attaching it
  # here makes it a release asset, which is what the Pages workflow builds index.yaml from.
  extra_files:
    - glob: ./dist-chart/*.tgz
  footer: |
    ---
    Released by [GoReleaser](https://goreleaser.com).
