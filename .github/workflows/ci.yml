name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          tools: go golangci-lint

      # goreleaser no longer runs `go mod tidy` of its own accord: a release build that
      # rewrites go.mod does it after every gate has passed, and ships something nobody
      # checked. Tidiness is a property of the commit instead, checked here.
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # `make check` is gofmt (reporting, never rewriting), go vet, golangci-lint,
      # the tests and then the race detector. The race detector is the slowest part
      # of the gate, so it gets exactly one step here and no separate run.
      - name: Quality gate
        run: make check

      - name: Smoke test
        run: make smoke

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          tools: helm promtool helm-docs

      - name: Check the alerting rules
        run: make alerts-lint

      - name: Lint and render the chart
        run: make chart-lint

      # The values reference on the documentation site is this generated file. If the two
      # are allowed to diverge, the site quietly documents a chart that no longer exists.
      - name: Check the generated chart README is up to date
        run: |
          make chart-docs
          git diff --exit-code -- charts/digitalocean-exporter/README.md

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      # --strict turns a broken link or a page missing from the nav into a failure here,
      # rather than a 404 discovered on the published site.
      - name: Build the documentation
        run: make docs

  image:
    # Validates the Dockerfile on every pull request without publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
