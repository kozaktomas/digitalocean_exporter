name: Pages

# Publishes two things to one GitHub Pages site: the versioned documentation, and the Helm
# chart repository that `helm repo add` and Terraform's helm_release consume.
#
# They are kept apart on purpose. mike owns the documentation and stores every built
# version on the `docs-versions` branch, because old documentation must keep working
# without being rebuilt. The chart index owns nothing: it is regenerated from the release
# assets on every deploy, so it cannot drift from the set of releases that actually exist.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "charts/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build the documentation from. Empty means the caller's ref."
        type: string
        required: false
      version:
        description: "Documentation version to publish, e.g. 0.2. Empty publishes dev."
        type: string
        required: false
      alias:
        description: "Alias to move onto that version, e.g. latest."
        type: string
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build the documentation from. Empty means this branch."
        type: string
        required: false
      version:
        description: "Documentation version to publish, e.g. 0.2. Empty publishes dev."
        type: string
        required: false
      alias:
        description: "Alias to move onto that version, e.g. latest."
        type: string
        required: false

# One Pages deployment at a time, and never cancel one in flight: a half-finished deploy
# would publish a site missing either the documentation or the chart index.
concurrency:
  group: pages
  cancel-in-progress: false

# Read-only by default. The docs job writes the docs branch and the deploy job
# talks to Pages; each grants itself exactly that below.
permissions:
  contents: read

env:
  DOCS_BRANCH: docs-versions
  PAGES_URL: https://kozaktomas.github.io/digitalocean_exporter
  KEEP_MINORS: "5"

jobs:
  # GitHub Pages keeps the first deployment it saw for a commit SHA and quietly ignores
  # later ones. A release tags the commit that bumps the chart version, and that commit
  # touches charts/ and docs/, so this workflow fires twice for one SHA: once for the push
  # to main, once for the tag. Only one of them can publish, and it has to be the release.
  #
  # So a push to a branch whose commit is already tagged stands down. With the tag pushed
  # before the branch, as the release notes in CLAUDE.md say, that makes the release's
  # deployment the one Pages keeps — without anyone having to remember why.
  #
  # Careful with the context here: a workflow reached through `workflow_call` inherits the
  # *caller's* `github` context, it does not get one of its own. release.yml is triggered
  # by a tag push, so in the release's run of this workflow `github.event_name` is `push`
  # — never `workflow_call` — and the tag does point at HEAD. Deciding on `event_name`
  # alone therefore stands the release itself down, which is the one run that must publish.
  # `github.ref_type` is inherited the same way but tells the two apart: it is `tag` for
  # the release and `branch` for a push to main, and this workflow's own `on: push` only
  # ever fires for a branch.
  guard:
    name: Decide whether this run publishes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, which is what this job is here to look at

      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "push" ] || [ "${REF_TYPE}" != "branch" ]; then
            echo "${EVENT_NAME} on a ${REF_TYPE}: not a branch push, so nothing to stand down for"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "${tag}" ]; then
            echo "${tag} points at this commit, so the release publishes it; standing down"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Build documentation
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike commits the built site to DOCS_BRANCH
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # mike needs the docs branch, not just this commit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      - name: Commit as the actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy this version
        env:
          VERSION: ${{ inputs.version }}
          ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            # A push to main documents the unreleased state.
            mike deploy --push --branch "${DOCS_BRANCH}" --update-aliases dev
            # Until the first release exists there is no `latest` for the site root to
            # redirect to, so point it at dev and let the first release take it over.
            if ! mike list --branch "${DOCS_BRANCH}" 2>/dev/null | grep -q '\blatest\b'; then
              mike set-default --push --branch "${DOCS_BRANCH}" dev
            fi
          else
            mike deploy --push --branch "${DOCS_BRANCH}" --update-aliases "${VERSION}" ${ALIAS:+"${ALIAS}"}
            if [ -n "${ALIAS}" ]; then
              mike set-default --push --branch "${DOCS_BRANCH}" "${ALIAS}"
            fi
          fi

      - name: Keep only the newest minors
        run: |
          set -euo pipefail
          stale=$( { mike list --branch "${DOCS_BRANCH}" --json 2>/dev/null || echo "[]"; } | python3 -c '
          import json, sys

          def semver(v):
              try:
                  return tuple(int(part) for part in v.split("."))
              except ValueError:
                  return None  # a named version such as dev, never pruned

          raw = sys.stdin.read().strip()
          entries = json.loads(raw) if raw else []
          numbered = sorted(
              (e["version"] for e in entries if semver(e["version"])),
              key=semver,
              reverse=True,
          )
          print(" ".join(numbered[int(sys.argv[1]):]))
          ' "${KEEP_MINORS}")
          if [ -n "${stale}" ]; then
            echo "Pruning documentation versions: ${stale}"
            # shellcheck disable=SC2086
            mike delete --push --branch "${DOCS_BRANCH}" ${stale}
          fi

  deploy:
    name: Assemble and deploy
    needs: [guard, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the built documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs-versions
          path: site

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Collect every released chart package
        env:
          GH_TOKEN: ${{ github.token }}
          # The documentation is checked out into site/, so the workspace root is not a
          # git repository and gh cannot infer which repo it is talking to. Without this
          # it fails, the loop runs zero times and an empty index gets published as if
          # nothing were wrong.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site/charts
          tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          for tag in ${tags}; do
            # A release without a chart asset is not an error: the first releases predate
            # the chart, and goreleaser attaches the package only from now on.
            gh release download "${tag}" --dir site/charts --pattern '*.tgz' --clobber || true
          done

          releases=$(printf '%s' "${tags}" | grep -c . || true)
          packages=$(find site/charts -name '*.tgz' | wc -l)
          echo "collected ${packages} chart package(s) from ${releases} release(s)"
          ls -l site/charts

          # Releases that yield no package at all means collection broke rather than that
          # there is nothing to publish. Fail loudly: an empty index.yaml deployed over a
          # working one is indistinguishable from success until someone tries to install.
          if [ "${releases}" -gt 0 ] && [ "${packages}" -eq 0 ]; then
            echo "::error::${releases} release(s) exist but no chart package was collected"
            exit 1
          fi

      - name: Build the chart repository index
        run: |
          set -euo pipefail
          # Absolute URLs, so the index works from the site root while the packages sit
          # under /charts. With no releases yet this writes a valid, empty index, which
          # `helm repo add` accepts — the bootstrap case is not a special case.
          helm repo index site/charts --url "${PAGES_URL}/charts"
          mv site/charts/index.yaml site/index.yaml

      - name: Drop the git metadata
        run: rm -rf site/.git

      # What the verification step below polls for. It names the commit this run is
      # deploying — the SHA Pages itself keys the deployment by, which for a
      # `workflow_dispatch` with `ref` is the dispatched ref rather than the commit the
      # documentation was built from. That is deliberate: the file exists to tell "the
      # site is serving what this run uploaded" from "the site is serving an older
      # upload", and it is the deployment SHA that decides which of the two happened.
      - name: Stamp the site with the commit being deployed
        run: printf '%s\n' "${GITHUB_SHA}" > site/deployed-commit.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # deploy-pages identifies a deployment by the commit SHA, and GitHub Pages keeps the
      # first deployment it saw for a SHA: a second one reports success and changes nothing.
      # That happens when a release tags the commit that was just pushed to main, so both
      # the push and the tag publish from one SHA. It is silent, which is the problem — the
      # workflow goes green and the site stays on the previous version. This step is what
      # makes it loud.
      #
      # It polls for the stamped commit, not for the version name: `dev`, and `0.3` for any
      # `0.3.x`, are already on the site from the first deployment that published them, so
      # an ignored deployment would satisfy a check for the name every time — on every
      # branch push and every patch release, which is exactly the set of runs this exists
      # to watch. The SHA changes with every commit, so a site left on an earlier upload
      # fails the check.
      - name: Verify the site serves what was just deployed
        run: |
          set -euo pipefail
          # The Pages CDN caches for ten minutes and a deployment does not always purge it,
          # so this polls rather than checking once.
          for attempt in $(seq 1 24); do
            served=$(curl -fsS "${PAGES_URL}/deployed-commit.txt" | tr -d '[:space:]' || true)
            if [ "${served}" = "${GITHUB_SHA}" ]; then
              echo "the site serves ${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt ${attempt}: the site serves ${served:-nothing yet}, not ${GITHUB_SHA}"
            sleep 15
          done
          echo "::error::deployment reported success but ${PAGES_URL} does not serve ${GITHUB_SHA}."
          echo "::error::GitHub Pages keeps the first deployment for a commit SHA. If this commit"
          echo "::error::was already deployed by another run, publish from a new commit."
          exit 1
