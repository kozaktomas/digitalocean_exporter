name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # goreleaser creates the GitHub Release
  packages: write   # helm push writes the chart to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v5

      - name: Publish the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          helm package charts/digitalocean-exporter --version "$VERSION" --app-version "$VERSION"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "digitalocean-exporter-${VERSION}.tgz" oci://ghcr.io/kozaktomas/chart
