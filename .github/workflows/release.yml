name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # goreleaser creates the GitHub Release

# A tag push that reaches GitHub twice starts two of these, and the second one fails
# uploading assets the first already attached. One release per tag, and never cancel one
# in flight: it would leave a release with only some of its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The documented release order is "push the tag, then the branch", so CI on `main` has
  # not started — let alone finished — when this workflow runs. Without this job the
  # binaries, the deb package, the chart and the documentation would all ship from a
  # commit nothing had checked. It is the same gate CI runs, on the same toolchain,
  # through the same composite action.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          tools: go golangci-lint helm promtool

      - name: Quality gate
        run: make check

      - name: Check the alerting rules
        run: make alerts-lint

      - name: Lint and render the chart
        run: make chart-lint

      - name: Smoke test
        run: make smoke

  release:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - id: version
        name: Derive the version from the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # The tag filter above still admits things like v1.2.beta. One number drives the
          # binary, the chart, the appVersion and the documentation directory, so a tag
          # that is not plain semver has to fail here rather than halfway through.
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${tag} is not a plain semantic version (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-tools
        with:
          tools: go helm

      # The chart version, the appVersion and every pinned version in the documentation
      # are text: nothing else in this workflow notices when the tag disagrees with them,
      # and the result is a published chart that contradicts its own install
      # instructions. Checked before packaging, so a mismatch costs nothing.
      - name: Check the tree matches the tag
        run: ./scripts/release-version-check.sh "${{ steps.version.outputs.version }}"

      - name: Package the Helm chart
        run: |
          set -euo pipefail
          mkdir -p dist-chart
          helm package charts/digitalocean-exporter \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist-chart

      # goreleaser attaches dist-chart/*.tgz to the release through release.extra_files.
      # The Pages workflow builds the chart repository index from those assets, so this
      # upload is what actually publishes the chart.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned to the major version: `latest` would move the release tooling under
          # a tag that was never built with it.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes documentation for this minor, moves `latest` onto it, and regenerates the
  # chart repository index so the new package appears in index.yaml.
  #
  # Called directly rather than triggered by `on: release`, because GitHub does not fire
  # workflow events for actions taken with GITHUB_TOKEN — and goreleaser creates the
  # release with exactly that token.
  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      version: ${{ needs.release.outputs.minor }}
      alias: latest
