name: Release

on:
  push:
    tags: ["v*.*.*"]

# Read-only by default; the jobs that publish grant themselves more below.
permissions:
  contents: read

# A tag push that reaches GitHub twice starts two of these, and the second one fails
# uploading assets the first already attached. One release per tag, and never cancel one
# in flight: it would leave a release with only some of its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The documented release order is "push the tag, then the branch", so CI on `main` has
  # not started — let alone finished — when this workflow runs. Without this job the
  # binaries, the deb package, the chart and the documentation would all ship from a
  # commit nothing had checked. It is the same gate CI runs, on the same toolchain,
  # through the same composite action.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          tools: go golangci-lint helm promtool

      - name: Quality gate
        run: make check

      - name: Check the alerting rules
        run: make alerts-lint

      - name: Lint and render the chart
        run: make chart-lint

      - name: Smoke test
        run: make smoke

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser creates the GitHub Release
      id-token: write # cosign keyless signing states this workflow as its identity
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the changelog

      - id: version
        name: Derive the version from the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # The tag filter above still admits things like v1.2.beta. One number drives the
          # binary, the chart, the appVersion and the documentation directory, so a tag
          # that is not plain semver has to fail here rather than halfway through.
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${tag} is not a plain semantic version (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      # syft writes the SBOMs and cosign signs the artifacts; both run under goreleaser.
      - uses: ./.github/actions/setup-tools
        with:
          tools: go helm syft cosign

      # The chart version, the appVersion and every pinned version in the documentation
      # are text: nothing else in this workflow notices when the tag disagrees with them,
      # and the result is a published chart that contradicts its own install
      # instructions. Checked before packaging, so a mismatch costs nothing.
      - name: Check the tree matches the tag
        run: ./scripts/release-version-check.sh "${{ steps.version.outputs.version }}"

      - name: Package the Helm chart
        run: |
          set -euo pipefail
          mkdir -p dist-chart
          helm package charts/digitalocean-exporter \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist-chart

      # goreleaser attaches dist-chart/*.tgz to the release through release.extra_files.
      # The Pages workflow builds the chart repository index from those assets, so this
      # upload is what actually publishes the chart.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned to the major version: `latest` would move the release tooling under
          # a tag that was never built with it.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # `latest` and the site root follow the highest version, not the newest tag. Releasing
  # v0.2.1 after v0.3.0 is an ordinary thing to do — a fix backported to the old minor —
  # and moving the alias onto it would send everyone reading the documentation, and every
  # `helm install` that follows it, back to 0.2. So the alias is passed only when the
  # minor being published is greater than or equal to the highest one mike already stores
  # on the docs branch; a backport publishes its own `0.2/` and leaves `latest` alone.
  #
  # `>=` rather than `>` because the documentation is versioned per minor: v0.3.1
  # republishes `0.3`, which is the version `latest` already points at, and the alias has
  # to move with it onto the newer content.
  alias:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.decide.outputs.alias }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MINOR: ${{ needs.release.outputs.minor }}
          REPO: ${{ github.repository }}
          DOCS_BRANCH: docs-versions # mike's storage, as pages.yml declares it
        run: |
          set -euo pipefail
          # versions.json is mike's own record of what is published. It is absent on the
          # first release, when the branch does not exist yet — that release is the
          # highest version by definition and takes the alias. Any other failure is fatal:
          # reading no versions looks exactly like publishing the highest one, and a
          # request that failed for some other reason must not be what moves `latest`.
          err=$(mktemp)
          if versions=$(gh api "repos/${REPO}/contents/versions.json?ref=${DOCS_BRANCH}" \
            -H "Accept: application/vnd.github.raw" 2>"${err}"); then
            :
          elif grep -q "Not Found" "${err}"; then
            echo "no versions published yet: ${DOCS_BRANCH} has no versions.json"
            versions=""
          else
            cat "${err}" >&2
            echo "::error::could not read the published versions from ${DOCS_BRANCH}"
            exit 1
          fi
          alias=$(printf '%s' "${versions}" | python3 -c '
          import json, sys

          def semver(v):
              try:
                  return tuple(int(part) for part in v.split("."))
              except ValueError:
                  return None  # a named version such as dev, never the highest

          raw = sys.stdin.read().strip()
          published = [semver(e["version"]) for e in (json.loads(raw) if raw else [])]
          highest = max((v for v in published if v), default=())
          print("latest" if semver(sys.argv[1]) >= highest else "")
          ' "${MINOR}")
          if [ -n "${alias}" ]; then
            echo "${MINOR} is the highest published version: moving latest onto it"
          else
            echo "a higher version than ${MINOR} is already published: leaving latest where it is"
          fi
          echo "alias=${alias}" >> "$GITHUB_OUTPUT"

  # Publishes documentation for this minor, moves `latest` onto it when this is the
  # highest version, and regenerates the chart repository index so the new package
  # appears in index.yaml.
  #
  # Called directly rather than triggered by `on: release`, because GitHub does not fire
  # workflow events for actions taken with GITHUB_TOKEN — and goreleaser creates the
  # release with exactly that token.
  pages:
    needs: [release, alias]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      version: ${{ needs.release.outputs.minor }}
      alias: ${{ needs.alias.outputs.latest }}
