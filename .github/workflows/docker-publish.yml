name: Docker Build & Publish

# Publishes the multi-arch image to GHCR.
#   push to main         -> the `latest` tag
#   push of a vX.Y.Z tag -> semver tags
# The publication gate is deliberately duplicated here rather than inherited
# from ci.yml: an image must never ship from a direct push to main that
# bypassed CI. It is one `make check` and nothing else, so this run does not
# repeat the tests or the race detector it has already carried out.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the one job that pushes to GHCR grants itself more below.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          tools: go golangci-lint
      # The whole gate, race detector included, in a single step.
      - name: Quality gate
        run: make check

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the image and its signature to GHCR
      id-token: write # cosign keyless signing states this workflow as its identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is driven manually so it can only land on the default branch.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Compute build args
        id: buildargs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildargs.outputs.version }}
            COMMIT_SHA=${{ steps.buildargs.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: ./.github/actions/setup-tools
        with:
          tools: cosign

      # Keyless: no key to store or leak. The signature is bound to this workflow's
      # OIDC identity and recorded in the public Rekor transparency log. Signed by
      # digest, which is what every tag of this push resolves to, so one signature
      # covers them all.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
