apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "digitalocean-exporter.fullname" . }}
  labels:
    {{- include "digitalocean-exporter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "digitalocean-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "digitalocean-exporter.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "digitalocean-exporter.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --web.listen-address=:{{ .Values.service.port }}
            - --do.token-file=/etc/digitalocean-exporter/token
            - --log.level={{ .Values.log.level }}
            - --log.format={{ .Values.log.format }}
            {{- if .Values.collectors.account.enabled }}
            - --collector.account
            - --collector.account.interval={{ .Values.collectors.account.interval }}
            {{- else }}
            - --no-collector.account
            {{- end }}
            {{- if .Values.collectors.balance.enabled }}
            - --collector.balance
            - --collector.balance.interval={{ .Values.collectors.balance.interval }}
            {{- else }}
            - --no-collector.balance
            {{- end }}
            {{- if .Values.collectors.databases.enabled }}
            - --collector.databases
            - --collector.databases.interval={{ .Values.collectors.databases.interval }}
            {{- else }}
            - --no-collector.databases
            {{- end }}
            {{- if .Values.collectors.droplets.enabled }}
            - --collector.droplets
            - --collector.droplets.interval={{ .Values.collectors.droplets.interval }}
            {{- else }}
            - --no-collector.droplets
            {{- end }}
            {{- if .Values.collectors.kubernetes.enabled }}
            - --collector.kubernetes
            - --collector.kubernetes.interval={{ .Values.collectors.kubernetes.interval }}
            {{- else }}
            - --no-collector.kubernetes
            {{- end }}
            {{- if .Values.collectors.limits.enabled }}
            - --collector.limits
            - --collector.limits.interval={{ .Values.collectors.limits.interval }}
            {{- else }}
            - --no-collector.limits
            {{- end }}
            {{- if .Values.collectors.registry.enabled }}
            - --collector.registry
            - --collector.registry.interval={{ .Values.collectors.registry.interval }}
            {{- else }}
            - --no-collector.registry
            {{- end }}
            {{- if .Values.collectors.spaces.enabled }}
            - --collector.spaces
            - --collector.spaces.interval={{ .Values.collectors.spaces.interval }}
            - --collector.spaces.timeout={{ .Values.collectors.spaces.timeout }}
            - --collector.spaces.concurrency={{ .Values.collectors.spaces.concurrency }}
            {{- with .Values.collectors.spaces.region }}
            - --spaces.region={{ . }}
            {{- end }}
            {{- range .Values.collectors.spaces.buckets }}
            - --collector.spaces.bucket={{ . }}
            {{- end }}
            - --spaces.access-key-file=/etc/digitalocean-exporter/spaces/access-key
            - --spaces.secret-key-file=/etc/digitalocean-exporter/spaces/secret-key
            {{- else }}
            - --no-collector.spaces
            {{- end }}
            {{- if .Values.collectors.volumes.enabled }}
            - --collector.volumes
            - --collector.volumes.interval={{ .Values.collectors.volumes.interval }}
            {{- else }}
            - --no-collector.volumes
            {{- end }}
            {{- if .Values.collectors.loadbalancers.enabled }}
            - --collector.loadbalancers
            - --collector.loadbalancers.interval={{ .Values.collectors.loadbalancers.interval }}
            {{- else }}
            - --no-collector.loadbalancers
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: token
              mountPath: /etc/digitalocean-exporter
              readOnly: true
            {{- if .Values.collectors.spaces.enabled }}
            - name: spaces
              mountPath: /etc/digitalocean-exporter/spaces
              readOnly: true
            {{- end }}
      volumes:
        - name: token
          secret:
            secretName: {{ include "digitalocean-exporter.secretName" . }}
            items:
              - key: {{ .Values.digitalocean.existingSecretKey }}
                path: token
        {{- if .Values.collectors.spaces.enabled }}
        - name: spaces
          secret:
            secretName: {{ include "digitalocean-exporter.spacesSecretName" . }}
            items:
              - key: {{ .Values.spaces.existingSecretAccessKeyKey }}
                path: access-key
              - key: {{ .Values.spaces.existingSecretSecretKeyKey }}
                path: secret-key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
