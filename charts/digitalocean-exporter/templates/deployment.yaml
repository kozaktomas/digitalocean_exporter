apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "digitalocean-exporter.fullname" . }}
  labels:
    {{- include "digitalocean-exporter.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- /*
  Recreate by default: with one replica the RollingUpdate surge runs two
  exporters side by side through every upgrade and token rotation, doubling
  the API spend and reporting the account twice for as long as both live.
  */}}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "digitalocean-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /*
        The exporter reads its credentials once, at startup. Without a checksum of
        the Secret in the pod template, a `helm upgrade` that rotates the token
        would update the Secret and leave the pod running with the old one.
        */}}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "digitalocean-exporter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "digitalocean-exporter.fullname" . }}
      {{- /*
      The exporter talks only to the DigitalOcean API. A token for the Kubernetes
      API is one more credential in the container for no reason.
      */}}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --web.listen-address=:{{ .Values.service.port }}
            - --do.token-file=/etc/digitalocean-exporter/token
            - --do.rate-limit={{ .Values.digitalocean.rateLimit }}
            - --log.level={{ .Values.log.level }}
            - --log.format={{ .Values.log.format }}
            {{- range .Values.filters.tags }}
            - --filter.tag={{ . }}
            {{- end }}
            {{- range .Values.filters.regions }}
            - --filter.region={{ . }}
            {{- end }}
            {{- if .Values.collectors.account.enabled }}
            - --collector.account
            - --collector.account.interval={{ .Values.collectors.account.interval }}
            {{- else }}
            - --no-collector.account
            {{- end }}
            {{- if .Values.collectors.apps.enabled }}
            - --collector.apps
            - --collector.apps.interval={{ .Values.collectors.apps.interval }}
            {{- else }}
            - --no-collector.apps
            {{- end }}
            {{- if .Values.collectors.balance.enabled }}
            - --collector.balance
            - --collector.balance.interval={{ .Values.collectors.balance.interval }}
            {{- else }}
            - --no-collector.balance
            {{- end }}
            {{- if .Values.collectors.certificates.enabled }}
            - --collector.certificates
            - --collector.certificates.interval={{ .Values.collectors.certificates.interval }}
            {{- else }}
            - --no-collector.certificates
            {{- end }}
            {{- if .Values.collectors.databases.enabled }}
            - --collector.databases
            - --collector.databases.interval={{ .Values.collectors.databases.interval }}
            - --collector.databases.timeout={{ .Values.collectors.databases.timeout }}
            {{- if .Values.collectors.databases.details }}
            - --collector.databases.details
            {{- else }}
            - --no-collector.databases.details
            {{- end }}
            {{- else }}
            - --no-collector.databases
            {{- end }}
            {{- if .Values.collectors.domains.enabled }}
            - --collector.domains
            - --collector.domains.interval={{ .Values.collectors.domains.interval }}
            {{- else }}
            - --no-collector.domains
            {{- end }}
            {{- if .Values.collectors.dropletautoscale.enabled }}
            - --collector.dropletautoscale
            - --collector.dropletautoscale.interval={{ .Values.collectors.dropletautoscale.interval }}
            {{- else }}
            - --no-collector.dropletautoscale
            {{- end }}
            {{- if .Values.collectors.droplets.enabled }}
            - --collector.droplets
            - --collector.droplets.interval={{ .Values.collectors.droplets.interval }}
            {{- else }}
            - --no-collector.droplets
            {{- end }}
            {{- if .Values.collectors.firewalls.enabled }}
            - --collector.firewalls
            - --collector.firewalls.interval={{ .Values.collectors.firewalls.interval }}
            {{- else }}
            - --no-collector.firewalls
            {{- end }}
            {{- if .Values.collectors.images.enabled }}
            - --collector.images
            - --collector.images.interval={{ .Values.collectors.images.interval }}
            {{- else }}
            - --no-collector.images
            {{- end }}
            {{- if .Values.collectors.kubernetes.enabled }}
            - --collector.kubernetes
            - --collector.kubernetes.interval={{ .Values.collectors.kubernetes.interval }}
            {{- if .Values.collectors.kubernetes.upgrades }}
            - --collector.kubernetes.upgrades
            {{- else }}
            - --no-collector.kubernetes.upgrades
            {{- end }}
            {{- else }}
            - --no-collector.kubernetes
            {{- end }}
            {{- if .Values.collectors.limits.enabled }}
            - --collector.limits
            - --collector.limits.interval={{ .Values.collectors.limits.interval }}
            {{- else }}
            - --no-collector.limits
            {{- end }}
            {{- if .Values.collectors.projects.enabled }}
            - --collector.projects
            - --collector.projects.interval={{ .Values.collectors.projects.interval }}
            - --collector.projects.timeout={{ .Values.collectors.projects.timeout }}
            {{- else }}
            - --no-collector.projects
            {{- end }}
            {{- if .Values.collectors.registry.enabled }}
            - --collector.registry
            - --collector.registry.interval={{ .Values.collectors.registry.interval }}
            {{- else }}
            - --no-collector.registry
            {{- end }}
            {{- if .Values.collectors.reservedips.enabled }}
            - --collector.reservedips
            - --collector.reservedips.interval={{ .Values.collectors.reservedips.interval }}
            {{- else }}
            - --no-collector.reservedips
            {{- end }}
            {{- if .Values.collectors.spaces.enabled }}
            - --collector.spaces
            - --collector.spaces.interval={{ .Values.collectors.spaces.interval }}
            - --collector.spaces.timeout={{ .Values.collectors.spaces.timeout }}
            - --collector.spaces.concurrency={{ .Values.collectors.spaces.concurrency }}
            {{- with .Values.collectors.spaces.region }}
            - --spaces.region={{ . }}
            {{- end }}
            {{- range .Values.collectors.spaces.buckets }}
            - --collector.spaces.bucket={{ . }}
            {{- end }}
            - --spaces.access-key-file=/etc/digitalocean-exporter-spaces/access-key
            - --spaces.secret-key-file=/etc/digitalocean-exporter-spaces/secret-key
            {{- else }}
            - --no-collector.spaces
            {{- end }}
            {{- if .Values.collectors.tags.enabled }}
            - --collector.tags
            - --collector.tags.interval={{ .Values.collectors.tags.interval }}
            {{- else }}
            - --no-collector.tags
            {{- end }}
            {{- if .Values.collectors.volumes.enabled }}
            - --collector.volumes
            - --collector.volumes.interval={{ .Values.collectors.volumes.interval }}
            {{- else }}
            - --no-collector.volumes
            {{- end }}
            {{- if .Values.collectors.loadbalancers.enabled }}
            - --collector.loadbalancers
            - --collector.loadbalancers.interval={{ .Values.collectors.loadbalancers.interval }}
            {{- else }}
            - --no-collector.loadbalancers
            {{- end }}
            {{- if .Values.collectors.cdn.enabled }}
            - --collector.cdn
            - --collector.cdn.interval={{ .Values.collectors.cdn.interval }}
            {{- else }}
            - --no-collector.cdn
            {{- end }}
            {{- if .Values.collectors.dropletmetrics.enabled }}
            - --collector.dropletmetrics
            - --collector.dropletmetrics.interval={{ .Values.collectors.dropletmetrics.interval }}
            - --collector.dropletmetrics.timeout={{ .Values.collectors.dropletmetrics.timeout }}
            - --collector.dropletmetrics.concurrency={{ .Values.collectors.dropletmetrics.concurrency }}
            {{- if .Values.collectors.dropletmetrics.agentOnly }}
            - --collector.dropletmetrics.agent-only
            {{- else }}
            - --no-collector.dropletmetrics.agent-only
            {{- end }}
            {{- else }}
            - --no-collector.dropletmetrics
            {{- end }}
            {{- if .Values.collectors.loadbalancermetrics.enabled }}
            - --collector.loadbalancermetrics
            - --collector.loadbalancermetrics.interval={{ .Values.collectors.loadbalancermetrics.interval }}
            - --collector.loadbalancermetrics.timeout={{ .Values.collectors.loadbalancermetrics.timeout }}
            - --collector.loadbalancermetrics.concurrency={{ .Values.collectors.loadbalancermetrics.concurrency }}
            {{- if .Values.collectors.loadbalancermetrics.extended }}
            - --collector.loadbalancermetrics.extended
            {{- else }}
            - --no-collector.loadbalancermetrics.extended
            {{- end }}
            {{- else }}
            - --no-collector.loadbalancermetrics
            {{- end }}
            {{- /*
            Last, so it reads as an addition to what the chart renders. It
            cannot override any of it: the flag parser rejects a flag given
            twice rather than taking the later one.
            */}}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- /*
          The chart itself sets no environment: credentials travel as files, and
          everything else is a flag. This is only for what the cluster imposes.
          */}}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
          {{- /*
          Liveness asks whether the process is worth killing, so it stays on
          /healthz, which answers without consulting a collector: a refresh that
          cannot reach the DigitalOcean API is not fixed by a restart, and a
          restart throws away every snapshot the other collectors hold.
          */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: {{ .Values.probes.scheme }}
          {{- /*
          Readiness is the opposite question, and /readyz answers it honestly:
          503 until every enabled collector has refreshed once. A collector
          emits nothing before its first success, so a pod that goes Ready
          earlier joins the Service and serves scrapes that are missing whole
          metrics.

          The budget is generous on purpose. Every collector defaults to a 5m
          interval and the two that fan out allow themselves 2m for one refresh,
          so a pod can legitimately take past seven minutes to have everything;
          10s * 45 plus the initial delay is 7m40s. A pod that has not made it
          by then has a collector that is failing rather than slow, which is
          what the failure is meant to report.
          */}}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              scheme: {{ .Values.probes.scheme }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 45
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: token
              mountPath: /etc/digitalocean-exporter
              readOnly: true
            {{- if .Values.collectors.spaces.enabled }}
            {{- /*
            A sibling of the token mount, not a directory inside it: kubelet
            manages a secret volume's contents with atomic symlink swaps, and a
            second mount point nested in one is needlessly fragile.
            */}}
            - name: spaces
              mountPath: /etc/digitalocean-exporter-spaces
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: token
          secret:
            secretName: {{ include "digitalocean-exporter.secretName" . }}
            items:
              - key: {{ .Values.digitalocean.existingSecretKey }}
                path: token
        {{- if .Values.collectors.spaces.enabled }}
        - name: spaces
          secret:
            secretName: {{ include "digitalocean-exporter.spacesSecretName" . }}
            items:
              - key: {{ .Values.spaces.existingSecretAccessKeyKey }}
                path: access-key
              - key: {{ .Values.spaces.existingSecretSecretKeyKey }}
                path: secret-key
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
