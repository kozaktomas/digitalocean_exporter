{{/*
Files.Get returns the file verbatim, so the label references in the rules'
annotations reach Prometheus rather than being rendered by Helm.
*/}}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "digitalocean-exporter.fullname" . }}
  labels:
    {{- include "digitalocean-exporter.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
{{ .Files.Get "alerts/digitalocean.rules.yaml" | indent 2 }}
{{- end }}
