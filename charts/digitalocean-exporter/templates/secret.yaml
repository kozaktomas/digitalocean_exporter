{{- if not .Values.digitalocean.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "digitalocean-exporter.fullname" . }}
  labels:
    {{- include "digitalocean-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.digitalocean.existingSecretKey }}: {{ required "digitalocean.token or digitalocean.existingSecret is required" .Values.digitalocean.token | quote }}
{{- end }}
{{- if and .Values.collectors.spaces.enabled (not .Values.spaces.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-spaces" (include "digitalocean-exporter.fullname" .) }}
  labels:
    {{- include "digitalocean-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.spaces.existingSecretAccessKeyKey }}: {{ required "spaces.accessKey or spaces.existingSecret is required when the spaces collector is enabled" .Values.spaces.accessKey | quote }}
  {{ .Values.spaces.existingSecretSecretKeyKey }}: {{ required "spaces.secretKey or spaces.existingSecret is required when the spaces collector is enabled" .Values.spaces.secretKey | quote }}
{{- end }}
