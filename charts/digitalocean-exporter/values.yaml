image:
  repository: ghcr.io/kozaktomas/digitalocean_exporter
  # Until the first release is tagged, only `latest` exists in the registry.
  # Pin this to the release version once one is published.
  tag: "latest"
  pullPolicy: IfNotPresent

# DigitalOcean API token. Either set `token` (the chart creates a Secret) or
# point `existingSecret` at a Secret you manage yourself. The token reaches the
# pod as a mounted file, never as an environment variable, so it cannot leak
# through `kubectl describe pod`.
digitalocean:
  token: ""
  existingSecret: ""
  existingSecretKey: token

# Spaces access key pair, used only by the spaces collector. Like the token, it
# reaches the pod as mounted files rather than environment variables.
spaces:
  accessKey: ""
  secretKey: ""
  existingSecret: ""
  existingSecretAccessKeyKey: spaces-access-key
  existingSecretSecretKeyKey: spaces-secret-key

collectors:
  account:
    enabled: true
    interval: 5m
  # The balance collector reads /v2/customers/my/balance, which needs a token
  # with the billing scope. A token scoped to resources alone gets 403 there;
  # set enabled to false for such a token.
  balance:
    enabled: true
    interval: 5m
  # The databases collector reports the state of the managed database
  # clusters, not their load: connections and queries come from a Prometheus
  # endpoint DigitalOcean runs per cluster, with credentials of its own.
  databases:
    enabled: true
    interval: 5m
  # The droplets collector reports one set of metrics per droplet, including
  # the droplets a managed Kubernetes cluster runs.
  droplets:
    enabled: true
    interval: 5m
  # The kubernetes collector reports the cluster and its node pools from the
  # outside. What runs inside is kube-state-metrics' job.
  kubernetes:
    enabled: true
    interval: 5m
  # The limits collector counts the droplets, reserved IPs and volumes the
  # account uses, which pair with the limits the account collector reports.
  limits:
    enabled: true
    interval: 5m
  # The registry collector reads the account's container registry. An account
  # that has none is not a failure: the collector then reports no metrics and
  # its collector_success stays 1, so it can be left enabled everywhere.
  registry:
    enabled: true
    interval: 5m
  # The spaces collector measures buckets by listing every object in them, so
  # it refreshes on a long interval and needs a timeout of its own. It
  # authenticates with a Spaces access key pair, not the API token: set
  # spaces.accessKey and spaces.secretKey below, or point spaces.existingSecret
  # at a Secret holding both. Listing all buckets needs a full-access key, so
  # name the buckets here when using a limited one.
  spaces:
    enabled: false
    interval: 6h
    timeout: 15m
    concurrency: 4
    region: ""
    buckets: []
  # The volumes collector reports the size of every block storage volume and
  # how many droplets it is attached to. A volume attached to none is billed
  # while serving nothing, which is what makes it worth an alert.
  volumes:
    enabled: true
    interval: 5m
  # The loadbalancers collector reports the state, the backend count and the
  # billed size of every load balancer. Traffic through them is the
  # loadbalancermetrics collector's job.
  loadbalancers:
    enabled: true
    interval: 5m
  # The cdn collector reports the CDN endpoints and the certificate each one
  # serves. DigitalOcean exposes no traffic figures for them, so this is
  # inventory only.
  cdn:
    enabled: true
    interval: 5m
  # The dropletmetrics collector reads DigitalOcean's monitoring API, which
  # answers one metric of one droplet per request: a refresh costs one droplet
  # listing plus 10 requests per droplet. Against the limit of 5000 requests an
  # hour that is fine for a handful of droplets and impossible for a hundred,
  # so it is off unless asked for. Work out 3600/interval * (1 + droplets*10)
  # before enabling it. The API samples every 2m, so a shorter interval than
  # that buys nothing. Droplets without DigitalOcean's monitoring agent report
  # no readings.
  dropletmetrics:
    enabled: false
    interval: 5m
    timeout: 2m
    concurrency: 4
  # The loadbalancermetrics collector reads the same monitoring API, at 7
  # requests per load balancer per refresh. An account has far fewer load
  # balancers than droplets, so the cost is small — but a load balancer cannot
  # run node_exporter, which makes this the only source for its traffic and for
  # which individual backend droplet is failing its health check.
  loadbalancermetrics:
    enabled: false
    interval: 5m
    timeout: 2m
    concurrency: 4

log:
  level: info
  format: logfmt

service:
  type: ClusterIP
  port: 9212

serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
