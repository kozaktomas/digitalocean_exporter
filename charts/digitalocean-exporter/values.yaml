image:
  repository: ghcr.io/kozaktomas/digitalocean_exporter
  # Until the first release is tagged, only `latest` exists in the registry.
  # Pin this to the release version once one is published.
  tag: "latest"
  pullPolicy: IfNotPresent

# DigitalOcean API token. Either set `token` (the chart creates a Secret) or
# point `existingSecret` at a Secret you manage yourself. The token reaches the
# pod as a mounted file, never as an environment variable, so it cannot leak
# through `kubectl describe pod`.
digitalocean:
  token: ""
  existingSecret: ""
  existingSecretKey: token

# Spaces access key pair, used only by the spaces collector. Like the token, it
# reaches the pod as mounted files rather than environment variables.
spaces:
  accessKey: ""
  secretKey: ""
  existingSecret: ""
  existingSecretAccessKeyKey: spaces-access-key
  existingSecretSecretKeyKey: spaces-secret-key

collectors:
  account:
    enabled: true
    interval: 5m
  # The balance collector reads /v2/customers/my/balance, which needs a token
  # with the billing scope. A token scoped to resources alone gets 403 there;
  # set enabled to false for such a token.
  balance:
    enabled: true
    interval: 5m
  # The databases collector reports the state of the managed database
  # clusters, not their load: connections and queries come from a Prometheus
  # endpoint DigitalOcean runs per cluster, with credentials of its own.
  databases:
    enabled: true
    interval: 5m
  # The droplets collector reports one set of metrics per droplet, including
  # the droplets a managed Kubernetes cluster runs.
  droplets:
    enabled: true
    interval: 5m
  # The limits collector counts the droplets, reserved IPs and volumes the
  # account uses, which pair with the limits the account collector reports.
  limits:
    enabled: true
    interval: 5m
  # The registry collector reads the account's container registry. An account
  # that has none is not a failure: the collector then reports no metrics and
  # its collector_success stays 1, so it can be left enabled everywhere.
  registry:
    enabled: true
    interval: 5m
  # The spaces collector measures buckets by listing every object in them, so
  # it refreshes on a long interval and needs a timeout of its own. It
  # authenticates with a Spaces access key pair, not the API token: set
  # spaces.accessKey and spaces.secretKey below, or point spaces.existingSecret
  # at a Secret holding both. Listing all buckets needs a full-access key, so
  # name the buckets here when using a limited one.
  spaces:
    enabled: false
    interval: 6h
    timeout: 15m
    concurrency: 4
    region: ""
    buckets: []

log:
  level: info
  format: logfmt

service:
  type: ClusterIP
  port: 9212

serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
