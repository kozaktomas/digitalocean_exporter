# -- Overrides the chart name used in resource names and in the
# `app.kubernetes.io/name` label.
nameOverride: ""
# -- Replaces the generated resource name outright. The generated name is
# `<release>-<chart>`, collapsed to just the release name when the release name
# already contains the chart name, so the common `helm install
# digitalocean-exporter` needs nothing here.
fullnameOverride: ""

image:
  # -- Container image repository.
  repository: ghcr.io/kozaktomas/digitalocean_exporter
  # -- Image tag. Empty means the chart's appVersion, which is the exporter release
  # this chart version was published with. Set it only to pin something else.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets granting the node access to the image registry, as
# `[{name: my-pull-secret}]`. Only needed when `image.repository` has been
# repointed at a private mirror; the public GHCR image needs none.
imagePullSecrets: []

digitalocean:
  # -- DigitalOcean API token. The chart puts it in a Secret it owns and mounts it
  # into the pod as a file, never as an environment variable, so it cannot leak
  # through `kubectl describe pod`. Mutually exclusive with `existingSecret`.
  token: ""
  # -- Name of a Secret you manage yourself holding the API token. Preferred over
  # `token` in real clusters, because it keeps the token out of your Helm values.
  existingSecret: ""
  # -- Key inside `digitalocean.existingSecret` that holds the token.
  existingSecretKey: token
  # -- Client-side limit on API requests per second, shared by every collector.
  # DigitalOcean allows 250 requests a minute, and the collectors would
  # otherwise spend their refreshes in bursts; 4 a second is 240 a minute, just
  # inside it. Set it to `0` to turn the limiter off.
  rateLimit: 4

spaces:
  # -- Spaces access key, used only by the spaces collector. This is an S3
  # credential, unrelated to the API token.
  accessKey: ""
  # -- Spaces secret key that pairs with `spaces.accessKey`.
  secretKey: ""
  # -- Name of a Secret you manage yourself holding both Spaces keys. Mutually
  # exclusive with `spaces.accessKey` and `spaces.secretKey`.
  existingSecret: ""
  # -- Key inside `spaces.existingSecret` that holds the access key.
  existingSecretAccessKeyKey: spaces-access-key
  # -- Key inside `spaces.existingSecret` that holds the secret key.
  existingSecretSecretKeyKey: spaces-secret-key

filters:
  # -- Report only resources carrying at least one of these tags. Empty means
  # every resource. The filter is applied by the resource collectors —
  # droplets, volumes, load balancers, databases, Kubernetes, firewalls and
  # both monitoring-API collectors; the account-wide collectors ignore it.
  tags: []
  # -- Report only resources in these regions, by slug (for example `fra1`).
  # Empty means every region. When both lists are set a resource must satisfy
  # both. Cloud firewalls have no region and are matched by tag alone.
  regions: []

collectors:
  account:
    # -- Report account status and the account's resource limits.
    enabled: true
    # -- How often the account collector refreshes.
    interval: 5m
  apps:
    # -- Report App Platform apps: tier, region, the phase of the active
    # deployment, whether one is in progress, and the instances each component
    # of the spec asks for. One list request covers the whole account. The
    # runtime metrics of an app — CPU, memory, restarts — are not here: they
    # live behind DigitalOcean's monitoring API, which the API client has no
    # methods for.
    enabled: true
    # -- How often the apps collector refreshes.
    interval: 5m
  balance:
    # -- Report account balance and month-to-date usage. Reads
    # `/v2/customers/my/balance`, which needs a token with the billing scope; a
    # token scoped to resources alone gets 403 there and the collector reports
    # `collector_success 0`. Disable it for such a token.
    enabled: true
    # -- How often the balance collector refreshes.
    interval: 5m
  certificates:
    # -- Report the TLS certificates the account holds, and when each one
    # expires. Off by default because a certificate changes when it is renewed
    # and not otherwise; enable it to alert on
    # `digitalocean_certificate_expiry_timestamp_seconds`, which catches a
    # `lets_encrypt` renewal that failed quietly.
    enabled: false
    # -- How often the certificates collector refreshes.
    interval: 5m
  databases:
    # -- Report the state, node count and storage of every managed database
    # cluster. This is inventory, not load: connections and queries come from a
    # per-cluster Prometheus endpoint DigitalOcean runs with credentials of its own.
    enabled: true
    # -- How often the databases collector refreshes.
    interval: 5m
    # -- Timeout of one full databases refresh, including the per-cluster
    # detail lookups.
    timeout: 2m
    # -- Ask each cluster for its read-only replicas and the age of its newest
    # backup. The only part of this collector that costs requests per cluster —
    # two per refresh — rather than one per refresh, and the only source of the
    # replica and backup metrics an alert can watch. Turn it off on an account
    # with many clusters where those requests are worth saving.
    details: true
  domains:
    # -- Report the DNS zones the account hosts and their default TTL. One list
    # request covers the whole account. The records inside a zone are not
    # reported: counting them would cost a request per zone.
    enabled: true
    # -- How often the domains collector refreshes.
    interval: 5m
  dropletautoscale:
    # -- Report every droplet autoscale pool: how many droplets it runs against
    # its minimum, maximum or fixed target, and the current CPU and memory
    # utilisation against the targets it scales on. One paged list request
    # covers the whole account.
    enabled: true
    # -- How often the dropletautoscale collector refreshes. Two minutes rather
    # than five because the utilisation the pool scales on moves on that
    # cadence, and a scaling event is exactly what this collector is watching
    # for.
    interval: 2m
  droplets:
    # -- Report the state, size and price of every droplet, including the droplets
    # that make up a managed Kubernetes cluster.
    enabled: true
    # -- How often the droplets collector refreshes.
    interval: 5m
  firewalls:
    # -- Report cloud firewalls: what each is attached to, how many rules it
    # carries, how many of those are open to the whole internet, and how many
    # droplets a change has not reached yet. Off by default because a ruleset
    # changes on deploys rather than continuously.
    enabled: false
    # -- How often the firewalls collector refreshes.
    interval: 5m
  images:
    # -- Report the private images the account stores: droplet and volume
    # snapshots, automatic droplet backups and uploaded custom images.
    # DigitalOcean bills every one of them by size for as long as it exists, and
    # nothing in the control panel nags about a snapshot nobody needs any more.
    enabled: true
    # -- How often the images collector refreshes. Ten minutes rather than five:
    # an image is created by a snapshot or a nightly backup, hours apart, so
    # reading the list more often only spends requests.
    interval: 10m
  kubernetes:
    # -- Report managed Kubernetes clusters and their node pools from the outside.
    # What runs inside a cluster is kube-state-metrics' job, not this exporter's.
    enabled: true
    # -- How often the kubernetes collector refreshes.
    interval: 5m
    # -- Ask what each cluster can be upgraded to. It is the only part of this
    # collector that costs a request per cluster rather than one per refresh, and
    # the only source of the upgrade metrics an alert can watch. Turn it off on an
    # account with many clusters where that per-cluster request is worth saving.
    upgrades: true
  limits:
    # -- Report droplets, reserved IPs and volumes in use, which pair with the
    # account limits the account collector reports.
    enabled: true
    # -- How often the limits collector refreshes.
    interval: 5m
  projects:
    # -- Report every project and how many resources of each type it owns,
    # counted by URN type from the project's resources list. Costs one API
    # request per project per refresh on top of the project list.
    enabled: true
    # -- How often the projects collector refreshes. Resources move between
    # projects when somebody reassigns them, so ten minutes is plenty.
    interval: 10m
    # -- Timeout of one full projects refresh, including the per-project
    # resources lookups. Separate from the global `--do.timeout` because the
    # collector fans out over projects.
    timeout: 2m
  registry:
    # -- Report Container Registry storage, subscription tier and repositories. An
    # account without a registry is not a failure: the collector reports no metrics
    # and keeps `collector_success 1`, so it is safe to leave enabled everywhere.
    enabled: true
    # -- How often the registry collector refreshes.
    interval: 5m
  reservedips:
    # -- Report every reserved IP address and whether it is assigned to a
    # droplet. DigitalOcean bills a reserved IP that is assigned to nothing, the
    # same way it bills an unattached volume, and both IPv4 and IPv6 addresses
    # are read.
    enabled: true
    # -- How often the reservedips collector refreshes.
    interval: 5m
  spaces:
    # -- Report the size and object count of Spaces buckets. Off by default
    # because it needs `spaces.accessKey` and `spaces.secretKey`, a Spaces key
    # pair, which is a separate credential from the API token.
    enabled: false
    # -- How often the spaces collector refreshes.
    interval: 5m
    # -- Timeout of one full Spaces refresh, all buckets together. Separate from
    # the global `--do.timeout` because the collector fans out over buckets.
    timeout: 2m
    # -- How many buckets are measured at once.
    concurrency: 4
    # -- Region used for bucket discovery and for buckets named without one.
    region: ""
    # -- Buckets to measure, each as `name` or `name@region`. An entry may also
    # name several buckets separated by commas. Leave empty to discover them,
    # which needs a full-access Spaces key; with a limited key the buckets have
    # to be named here.
    buckets: []
  tags:
    # -- Report how many resources of each type carry every tag, straight from
    # the tag list: one paged request per refresh however many resources the
    # tags are spread across.
    enabled: true
    # -- How often the tags collector refreshes. A tag set changes on deploys
    # rather than continuously, so ten minutes is plenty.
    interval: 10m
  volumes:
    # -- Report the size of every block storage volume and how many droplets it is
    # attached to. A volume attached to none is billed while serving nothing, which
    # is what makes it worth an alert.
    enabled: true
    # -- How often the volumes collector refreshes.
    interval: 5m
  loadbalancers:
    # -- Report the state, backend count and billed size of every load balancer.
    # Traffic through them belongs to the loadbalancermetrics collector.
    enabled: true
    # -- How often the loadbalancers collector refreshes.
    interval: 5m
  cdn:
    # -- Report CDN endpoints, their cache TTL and the certificate each one serves.
    # DigitalOcean exposes no traffic figures for CDN endpoints, so this is
    # inventory only.
    enabled: true
    # -- How often the cdn collector refreshes.
    interval: 5m
  dropletmetrics:
    # -- Report CPU, memory, disk and load per droplet from DigitalOcean's
    # monitoring API. Off by default because that API answers one metric of one
    # droplet per request: a refresh costs one droplet listing plus 10 requests per
    # droplet, against an account limit of 5000 requests an hour. Work out
    # `3600/interval * (1 + droplets*10)` before enabling it.
    enabled: false
    # -- How often the dropletmetrics collector refreshes. The API samples every
    # 2m, so anything shorter buys nothing.
    interval: 5m
    # -- Timeout of one full dropletmetrics refresh.
    timeout: 2m
    # -- How many droplets are queried at once.
    concurrency: 4
    # -- Measure only droplets whose listing reports DigitalOcean's monitoring
    # agent, saving the 10 requests a droplet without it costs for no readings.
    # Off by default: the feature is set on droplets created with the agent, so
    # one installed later — or a managed Kubernetes node, which reports
    # readings without it — would go unmeasured and disappear from the metrics.
    agentOnly: false
  loadbalancermetrics:
    # -- Report traffic and per-backend health per load balancer, at 7 monitoring
    # API requests per load balancer per refresh. Off by default, but an account
    # has far fewer load balancers than droplets, so the cost is usually small —
    # and a load balancer cannot run node_exporter, which makes this the only
    # source for its traffic and for which backend droplet is failing its check.
    enabled: false
    # -- How often the loadbalancermetrics collector refreshes.
    interval: 5m
    # -- Timeout of one full loadbalancermetrics refresh.
    timeout: 2m
    # -- How many load balancers are queried at once.
    concurrency: 4
    # -- Also read the extended metric set per load balancer: TLS connections,
    # request queue size, latency percentiles (p50/p95/p99 and averages),
    # network throughput and firewall drops. Off by default because it raises
    # the cost from 7 to 27 monitoring API requests per load balancer per
    # refresh.
    extended: false

log:
  # -- Log level: `debug`, `info`, `warn` or `error`.
  level: info
  # -- Log format: `logfmt` or `json`.
  format: logfmt

service:
  # -- Service type.
  type: ClusterIP
  # -- Port the service exposes, and the port the container listens on: the chart
  # renders this value into `--web.listen-address` as well as into `containerPort`.
  port: 9212

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor. Requires the CRD to exist in
  # the cluster.
  enabled: false
  # -- Scrape interval. Collectors refresh in the background, so this is
  # independent of how often the DigitalOcean API is called.
  interval: 60s
  # -- Scrape timeout. Serving `/metrics` only reads an in-memory snapshot, so it
  # never waits on the API.
  scrapeTimeout: 10s
  # -- Extra labels for the ServiceMonitor, for whatever your Prometheus selects on.
  labels: {}
  # -- Namespaces the ServiceMonitor discovers the Service in, e.g.
  # `{matchNames: [monitoring]}`. Empty means the ServiceMonitor's own namespace,
  # which is right whenever it is installed alongside the chart; set it only when
  # the ServiceMonitor lives somewhere else, such as a central monitoring
  # namespace.
  namespaceSelector: {}
  # -- Label on the Service whose value becomes the `job` label of every scraped
  # series. Empty keeps the operator's default, which is the Service name.
  jobLabel: ""
  # -- Keep the label values the exporter serves when they collide with the
  # target labels Prometheus attaches. The exporter's own metrics collide with
  # nothing, so the default off is the safe one; turn it on only if a relabeling
  # here creates a collision on purpose.
  honorLabels: false
  # -- Relabelings applied to the discovered targets before scraping, in
  # Prometheus Operator `RelabelConfig` form.
  relabelings: []
  # -- Relabelings applied to the scraped samples before ingestion — the place to
  # drop a metric you do not want to store, such as the Go runtime series.
  metricRelabelings: []

prometheusRule:
  # -- Create a Prometheus Operator PrometheusRule holding the bundled alerting
  # rules. Requires the CRD to exist in the cluster. Off by default, like the
  # ServiceMonitor: a chart that installs alerts nobody asked for is a chart that
  # pages somebody at 3am.
  enabled: false
  # -- Extra labels for the PrometheusRule, for whatever your Prometheus selects
  # rules on. For kube-prometheus-stack that is usually `release: <release name>`.
  labels: {}
  # -- Namespace to create the PrometheusRule in. Empty means the release
  # namespace. Some Prometheus installations only pick up rules from their own
  # namespace (`ruleNamespaceSelector` unset with Prometheus running elsewhere),
  # which is when this is worth setting.
  namespace: ""

grafana:
  dashboards:
    # -- Render the bundled Grafana dashboards as ConfigMaps, one per dashboard,
    # labelled for the Grafana sidecar to load. Off by default: without the
    # sidecar running, these are ConfigMaps nothing ever reads.
    enabled: false
    # -- Label key the Grafana sidecar watches for. The default matches the
    # sidecar shipped with kube-prometheus-stack and the Grafana chart.
    label: grafana_dashboard
    # -- Value of that label.
    labelValue: "1"
    # -- Grafana folder to file the dashboards into, through a `grafana_folder`
    # annotation. It only takes effect if the Grafana sidecar itself runs with
    # `folderAnnotation: grafana_folder` and
    # `provider.foldersFromFilesStructure: true`; without that the annotation is
    # inert and the dashboards land in the sidecar's default folder.
    folder: ""

networkPolicy:
  # -- Create a NetworkPolicy for the pod. Off by default because it only does
  # anything on a cluster whose CNI enforces NetworkPolicy — on one that does
  # not, it renders and is silently ignored. When on, egress is limited to DNS
  # and to TCP 443, which is all the exporter needs: the DigitalOcean API and
  # Spaces both live behind HTTPS. Ingress is limited to the metrics port, from
  # whatever the two selectors below allow.
  enabled: false
  ingress:
    # -- Namespaces allowed to scrape the metrics port, as a label selector.
    # The empty selector allows every namespace; narrow it to where your
    # Prometheus runs, e.g.
    # `{matchLabels: {kubernetes.io/metadata.name: monitoring}}`.
    namespaceSelector: {}
    # -- Pods within those namespaces allowed to scrape, as a label selector.
    # The empty selector allows every pod.
    podSelector: {}

probes:
  # -- Scheme the liveness and readiness probes use, `HTTP` or `HTTPS`. Switch
  # it to `HTTPS` whenever a web configuration passed through `extraArgs` turns
  # TLS on: the toolkit serves every path over TLS, probes included, and a
  # probe left on plain HTTP fails against the TLS listener until the pod
  # crash-loops. The kubelet skips certificate verification on HTTPS probes,
  # so a self-signed pair works.
  scheme: HTTP

# -- Container resources. The exporter holds one snapshot per collector in memory
# and does nothing between refreshes.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# -- Deployment update strategy. Recreate rather than Kubernetes' RollingUpdate
# default, because with one replica the rolling surge runs two exporters side by
# side through every upgrade — and every token rotation, since the Secret
# checksum annotation rolls the pod — doubling the API spend and reporting the
# same account twice for as long as both live, which is exactly what running a
# single replica is meant to avoid. The cost is a metrics gap of one pod start,
# and a failed scrape or two is the honest picture of an exporter restarting.
strategy:
  type: Recreate

# -- Extra annotations for the pod. The chart already sets a checksum of the
# Secret here, and merges these on top of it.
podAnnotations: {}
# -- Extra labels for the pod, merged over the chart's own — for whatever your
# cluster tooling selects pods on, such as a cost allocation or network policy
# label. Do not repeat a label the chart already sets.
podLabels: {}
# -- PriorityClass for the pod. An exporter is worth less than what it watches,
# so a cluster with priority classes usually wants a low one here rather than
# the default.
priorityClassName: ""
# -- Extra command-line flags for the exporter, appended after the ones the
# chart renders. This is for a flag that has no value of its own here yet, such
# as `--do.timeout=20s`. It cannot override one the chart already renders: the
# flag parser rejects a repeated flag and the container then crash-loops.
extraArgs: []
# -- Extra environment entries for the container, in Kubernetes `env` form, so
# `valueFrom` works as well as plain `value`. This is for what the cluster
# imposes — a proxy, a resource attribute for a tracing sidecar — not for
# credentials: the token stays in the mounted Secret, where it cannot leak
# through `kubectl describe pod`.
extraEnv: []
# -- Extra volumes for the pod, in Kubernetes `volumes` form — e.g. a Secret
# holding an exporter-toolkit web configuration for TLS or basic auth. Pair each
# entry with one in `extraVolumeMounts`.
extraVolumes: []
# -- Extra volume mounts for the container. The container's root filesystem is
# read-only, so any file the exporter must read — a web configuration, a private
# CA bundle — has to arrive through one of these.
extraVolumeMounts: []
# -- Node selector for the pod.
nodeSelector: {}
# -- Tolerations for the pod.
tolerations: []
# -- Affinity rules for the pod.
affinity: {}
