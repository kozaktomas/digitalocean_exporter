# Alerting rules for digitalocean_exporter.
#
# Plain Prometheus rule groups: point `rule_files` at this file directly, or let the
# Helm chart wrap it in a PrometheusRule with `prometheusRule.enabled=true`.
#
# Every threshold here assumes collectors refresh on their default interval — 5m for
# every collector but `images`, which refreshes every 10m. A collector deliberately
# run slower needs the matching `for` raised to match.
groups:
  - name: digitalocean-exporter
    rules:
      - alert: DigitalOceanExporterAbsent
        expr: absent(digitalocean_exporter_build_info) == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: No digitalocean_exporter is reporting
          description: >-
            Prometheus has had no digitalocean_exporter_build_info sample for 15 minutes.
            Nothing about the DigitalOcean account is being observed.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#the-exporter-itself

      - alert: DigitalOceanExporterCollectorFailing
        expr: digitalocean_exporter_collector_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Collector {{ $labels.collector }} has been failing for 15 minutes
          description: >-
            The collector keeps serving its last good snapshot, so its metrics are stale
            rather than missing. Check the exporter's logs for the refresh error. A
            `balance` collector failing this way is usually a token without the billing
            scope.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#the-exporter-itself

      - alert: DigitalOceanExporterCollectorStale
        expr: time() - digitalocean_exporter_collector_last_success_timestamp_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Collector {{ $labels.collector }} has not refreshed for an hour
          description: >-
            This catches a refresh that hangs rather than fails, which leaves
            collector_success at 1 while the data ages. The threshold is an hour, so
            raise it if this collector is deliberately run at an interval longer than
            that.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#the-exporter-itself

      - alert: DigitalOceanExporterRateLimitLow
        expr: >-
          digitalocean_exporter_api_rate_limit_remaining
          / digitalocean_exporter_api_rate_limit < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Under 10% of the DigitalOcean API budget is left this hour
          description: >-
            The ratio is against the account's own ceiling rather than a fixed number,
            because the hourly allowance varies by account and is shared with everything
            else using this token. `digitalocean_exporter_api_rate_limit_reset_timestamp_seconds
            - time()` is how many seconds the starvation still has to run; refreshes that
            fail before then keep their previous snapshot. Lengthen the interval of the
            expensive collectors — dropletmetrics costs 10 requests per droplet per
            refresh — and check
            `sum by (collector) (rate(digitalocean_exporter_api_requests_total[30m]))` for
            which one is spending it.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#the-exporter-itself

      - alert: DigitalOceanExporterAPIErrors
        expr: >-
          sum by (collector, status) (
            rate(digitalocean_exporter_api_requests_total{status=~"429|5..|error"}[15m])
          ) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Collector {{ $labels.collector }} keeps getting {{ $labels.status }} from
            the DigitalOcean API
          description: >-
            More than an occasional request from this collector is being answered with a
            429, a 5xx or no response at all, sustained over fifteen minutes. Retries are
            counted too, because each one spends from the budget. A rising 429 rate means
            `--do.rate-limit` is set past what the account's hourly allowance covers, or
            something else is spending the same token; a steady 5xx or transport-error
            rate is DigitalOcean or the network between here and it. Refreshes that fail
            outright keep their previous snapshot and show up in
            digitalocean_exporter_collector_success.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#the-exporter-itself

  - name: digitalocean-account
    rules:
      - alert: DigitalOceanAccountNotActive
        expr: digitalocean_account_status{status!="active"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The DigitalOcean account status is {{ $labels.status }}
          description: >-
            The account is not active. `warning` is the billing-trouble state — an unpaid
            invoice or a card DigitalOcean could not charge — and it is the one that ends
            with resources being destroyed if it is left alone; `locked` means that has
            already begun and the API will refuse to create anything. Neither clears
            itself: settle the balance or contact DigitalOcean support. Every resource on
            the account is at stake, which is why this is critical rather than a warning.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#account-limits

      - alert: DigitalOceanAccountNearDropletLimit
        expr: digitalocean_account_droplets / digitalocean_account_droplet_limit > 0.8
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The account uses over 80% of its droplet limit
          description: >-
            Creating a droplet past the limit fails, which surfaces as a failed deploy or
            a Kubernetes node pool that will not scale up.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#account-limits

      - alert: DigitalOceanAccountNearVolumeLimit
        expr: digitalocean_account_volumes / digitalocean_account_volume_limit > 0.8
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The account uses over 80% of its volume limit
          description: >-
            A PersistentVolumeClaim that cannot be provisioned leaves a pod pending with
            no obvious cause.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#account-limits

      - alert: DigitalOceanAccountNearReservedIPLimit
        expr: digitalocean_account_reserved_ips / digitalocean_account_reserved_ip_limit > 0.8
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The account uses over 80% of its reserved IP limit
          description: Reserving another IP address will fail once the limit is reached.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#account-limits

  - name: digitalocean-resources
    rules:
      - alert: DigitalOceanDropletDown
        expr: >-
          digitalocean_droplet_up == 0
            unless on (id) digitalocean_droplet_info{status=~"off|archive"}
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Droplet {{ $labels.name }} is not active
          description: >-
            DigitalOcean reports the droplet in a status other than active. A droplet
            being rebuilt or resized passes through this state briefly; fifteen minutes
            of it is not routine. The two statuses somebody chooses on purpose, off and
            archive, are excluded: a droplet an operator powered off is not an incident
            and paging on it teaches people to ignore this alert. What is left is a
            droplet DigitalOcean itself stopped, or one stuck in new — both worth waking
            somebody for. A droplet left off is still billed, which
            DigitalOceanDropletOff reports at info.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanDropletAutoscalePoolAtMaximum
        expr: >-
          (digitalocean_droplet_autoscale_pool_active_instances
             >= digitalocean_droplet_autoscale_pool_max_instances)
            and (
              (digitalocean_droplet_autoscale_pool_current_cpu_utilization_ratio
                 > digitalocean_droplet_autoscale_pool_target_cpu_utilization_ratio)
              or
              (digitalocean_droplet_autoscale_pool_current_memory_utilization_ratio
                 > digitalocean_droplet_autoscale_pool_target_memory_utilization_ratio)
            )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Autoscale pool {{ $labels.name }} is at its maximum and over its target
          description: >-
            The pool has run at its configured maximum for half an hour while its
            utilisation stays above the target it scales on, so the autoscaler wants
            more droplets than it is allowed and the ones running are working harder
            than intended. Half an hour separates a pool that has settled there from
            one riding out a spike, which a cooldown of a few minutes would absorb on
            its own. Raise the pool's maximum, or treat the ceiling as a deliberate
            budget and accept the elevated utilisation — but then this alert is the
            reminder that scaling has stopped there. A pool with a fixed target has no
            maximum and cannot fire this. The account droplet limit can impose the
            same ceiling from outside, which DigitalOceanAccountNearDropletLimit
            reports.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanKubernetesClusterDown
        expr: digitalocean_kubernetes_cluster_up == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes cluster {{ $labels.name }} is not running
          description: >-
            The managed control plane is in a status other than running. This says
            nothing about the workloads inside it, which kube-state-metrics reports.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanNodePoolUnderProvisioned
        expr: >-
          digitalocean_kubernetes_node_pool_nodes_running
            < digitalocean_kubernetes_node_pool_nodes
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Pool {{ $labels.pool }} of cluster {{ $labels.cluster }} is short of nodes
          description: >-
            Fewer nodes are running than the pool is sized for. Half an hour of it means
            a node failed to come back rather than a rolling replacement in progress.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanKubernetesNodeNotRunning
        expr: digitalocean_kubernetes_node_state{state="running"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Node {{ $labels.node }} of pool {{ $labels.pool }} in cluster
            {{ $labels.cluster }} is not running
          description: >-
            The node is provisioning, draining or being deleted rather than serving. Half
            an hour of it is a node that failed to come up rather than one being replaced,
            and the pool is short of the capacity it is billed for. The droplet underneath
            it is named by digitalocean_kubernetes_node_info.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanKubernetesUpgradeAvailable
        expr: >-
          (digitalocean_kubernetes_cluster_upgrade_available == 1)
            unless on (cluster_id) (
              label_replace(digitalocean_kubernetes_cluster_auto_upgrade,
                            "cluster_id", "$1", "id", "(.*)") == 1
            )
        for: 24h
        labels:
          severity: info
        annotations:
          summary: Kubernetes cluster {{ $labels.cluster }} has an upgrade available
          description: >-
            DigitalOcean offers a newer version and the cluster does not take it by
            itself, so somebody has to. It waits a day because a version appears hours
            before anyone would act on it, and it stays quiet for a cluster with
            auto-upgrade on, which installs it in its own maintenance window.
            digitalocean_kubernetes_cluster_available_version_info names the versions.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanKubernetesNodePoolAtMaximum
        expr: >-
          (digitalocean_kubernetes_node_pool_nodes
             >= digitalocean_kubernetes_node_pool_max_nodes)
            and (digitalocean_kubernetes_node_pool_auto_scale == 1)
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Pool {{ $labels.pool }} of cluster {{ $labels.cluster }} sits at its maximum size
          description: >-
            The pool autoscales and has been at its configured ceiling for an hour, so
            the autoscaler has no headroom left: pods that need another node will stay
            pending, and nothing else says why. An hour distinguishes a pool that has
            settled at the top from one passing through a spike. Raise
            the pool's maximum, or treat the ceiling as a deliberate budget and leave it —
            but then this alert is the reminder that scaling has stopped there. The
            account droplet limit can impose the same ceiling from outside, which
            DigitalOceanAccountNearDropletLimit reports.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanLoadBalancerDown
        expr: digitalocean_loadbalancer_status == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Load balancer {{ $labels.name }} is not active
          description: The load balancer is in a status other than active.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanLoadBalancerWithoutBackends
        expr: digitalocean_loadbalancer_status == 1 and digitalocean_loadbalancer_droplets == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Load balancer {{ $labels.name }} has no backend droplets
          description: >-
            An active load balancer proxying to nothing answers every request with an
            error. A load balancer that selects its backends by tag reports zero until
            something carries the tag.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanDatabaseUnhealthy
        expr: digitalocean_database_status == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Database cluster {{ $labels.name }} is not online
          description: >-
            The managed cluster is in a status other than online. Load and query metrics
            come from DigitalOcean's per-cluster endpoint, not from this exporter.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanDatabaseMaintenancePending
        expr: digitalocean_database_maintenance_pending == 1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Database cluster {{ $labels.name }} has maintenance pending
          description: >-
            DigitalOcean has an update queued for the cluster and will apply it in the
            cluster's maintenance window, which usually means a failover on a
            multi-node cluster and a short outage on a single-node one. This is
            something to read before the window arrives, not something to act on — check
            when the window falls and whether it suits, and apply the maintenance by
            hand first if a quieter moment is available.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanDatabaseBackupStale
        expr: time() - digitalocean_database_last_backup_timestamp_seconds > 36 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Database cluster {{ $labels.name }} has no backup newer than 36 hours
          description: >-
            DigitalOcean backs a managed cluster up daily, so the newest backup should
            never be much older than a day; thirty-six hours means at least one daily
            backup did not happen, and a restore today would lose everything written
            since the last one. The metric needs --collector.databases.details; engines
            without backups, such as caching clusters, never report it and cannot fire
            this.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

      - alert: DigitalOceanAppDeploymentError
        expr: digitalocean_app_deployment_phase{phase="ERROR"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The deployment App Platform is serving for {{ $labels.name }} is in error
          description: >-
            The app's active deployment failed to build or to roll out, so App Platform is
            serving whatever was live before it — the app looks healthy from the outside
            while the change nobody noticed failing is not on it. Ten minutes is longer
            than a build takes to give up, so this is a settled failure rather than one
            passing through. Read the build and deploy logs of {{ $labels.name }}
            ({{ $labels.id }}) in the App Platform console.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#resources

  # Everything in this group reads the monitoring-API collectors, dropletmetrics
  # and loadbalancermetrics, which are off by default because their request cost
  # scales with the account. The rules stay silent until those collectors are
  # switched on.
  - name: digitalocean-monitoring
    rules:
      - alert: DigitalOceanDropletMetricsUnavailable
        expr: digitalocean_droplet_metrics_up == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No monitoring data for droplet {{ $labels.name }}
          description: >-
            DigitalOcean's monitoring API returned nothing for this droplet. The usual
            cause is the droplet agent not running, which also blanks the graphs in the
            DigitalOcean console.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

      - alert: DigitalOceanDropletDiskAlmostFull
        expr: >-
          digitalocean_droplet_filesystem_free_bytes
            / digitalocean_droplet_filesystem_size_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Filesystem {{ $labels.mountpoint }} on droplet {{ $labels.name }} has under
            10% free
          description: >-
            A filesystem that fills up takes its droplet down in ways that rarely name
            the disk: databases stop accepting writes, logs stop being written, and the
            processes that die first are not the ones filling it. Under ten percent on a
            small droplet is little room indeed, so find what is growing on
            {{ $labels.device }} before DigitalOceanDropletDiskCritical takes over at
            five.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

      - alert: DigitalOceanDropletDiskCritical
        expr: >-
          digitalocean_droplet_filesystem_free_bytes
            / digitalocean_droplet_filesystem_size_bytes < 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: >-
            Filesystem {{ $labels.mountpoint }} on droplet {{ $labels.name }} has under
            5% free
          description: >-
            The last of the space on {{ $labels.device }} is going, and what happens at
            zero is not graceful. Free space now — logs, caches, forgotten downloads —
            or resize the droplet. The monitoring API samples every two minutes and this
            exporter refreshes every five, so the true figure may already be lower than
            the one that fired this.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

      - alert: DigitalOceanDropletMemoryLow
        expr: >-
          digitalocean_droplet_memory_available_bytes
            / digitalocean_droplet_memory_total_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Droplet {{ $labels.name }} has under 10% of its memory available
          description: >-
            Available memory — what could be handed to new applications without swapping,
            not merely what is free — has been under ten percent for a quarter of an
            hour. The next step down is the kernel's OOM killer choosing a victim, and it
            rarely chooses well. Fifteen minutes filters out a burst that the page cache
            gives back on its own.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

      - alert: DigitalOceanLoadBalancerMetricsUnavailable
        expr: digitalocean_loadbalancer_metrics_up == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No monitoring data for load balancer {{ $labels.name }}
          description: >-
            DigitalOcean's monitoring API returned nothing for this load balancer, so the
            backend health and frontend metrics beside this alert are stale, not current.
            Unlike a droplet there is no agent to have stopped: this is the monitoring
            API itself declining to answer for the load balancer, which is worth a look
            in the DigitalOcean console.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

      - alert: DigitalOceanLoadBalancerBackendUnhealthy
        expr: digitalocean_loadbalancer_droplets_health_checks < 100
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: >-
            Backend {{ $labels.server }} of load balancer {{ $labels.name }} is failing
            its health check
          description: >-
            The load balancer's own health check has marked this backend down, so it is
            getting no traffic and the remaining backends are carrying its share. The
            value is 100 for a healthy backend; anything under that for ten minutes is a
            backend that is not coming back on its own. Check the service and the health
            check's path and port on the droplet — if every backend fails at once, the
            check's definition is the likelier fault than every droplet together.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

      - alert: DigitalOceanLoadBalancerDropletDowntime
        expr: digitalocean_loadbalancer_droplets_downtime > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Backend {{ $labels.server }} of load balancer {{ $labels.name }} is reporting
            downtime
          description: >-
            The load balancer counts this backend as down. It is 0 for a backend that is
            up, so anything above zero sustained for ten minutes says the backend keeps
            dropping out — flapping, if DigitalOceanLoadBalancerBackendUnhealthy is not
            firing alongside it, which is a backend that passes the check just often
            enough to keep receiving traffic it then fails to serve.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

      - alert: DigitalOceanLoadBalancerConnectionsNearLimit
        expr: >-
          digitalocean_loadbalancer_frontend_connections_current
            / digitalocean_loadbalancer_frontend_connections_limit > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Load balancer {{ $labels.name }} uses over 80% of its connection limit
          description: >-
            Connections past the limit are refused, and to the client that is the site
            being down while every backend stays healthy. The limit scales with the load
            balancer's size, so the fix is more size units — an operation DigitalOcean
            applies without downtime. Ten minutes over eighty percent is sustained load,
            not a spike.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#monitoring-api

  - name: digitalocean-security
    rules:
      - alert: DigitalOceanCertificateExpiringSoon
        expr: (digitalocean_certificate_expiry_timestamp_seconds - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Certificate {{ $labels.name }} expires in under 14 days
          description: >-
            DigitalOcean renews a lets_encrypt certificate itself, but a renewal can fail
            quietly: the certificate keeps its old expiry while its state turns to error.
            Time remaining is the thing to watch, not state.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#certificates-and-firewalls

      - alert: DigitalOceanCertificateExpiringCritical
        expr: (digitalocean_certificate_expiry_timestamp_seconds - time()) / 86400 < 3
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: Certificate {{ $labels.name }} expires in under 3 days
          description: >-
            Automatic renewal has had its window and has not produced a new certificate.
            Replace it by hand.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#certificates-and-firewalls

      - alert: DigitalOceanLoadBalancerCertificateExpiring
        expr: >-
          (digitalocean_certificate_expiry_timestamp_seconds - time()) / 86400 < 14
          and on (id)
          label_replace(digitalocean_loadbalancer_forwarding_rule_info{certificate_id!=""},
          "id", "$1", "certificate_id", "(.+)")
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Certificate {{ $labels.name }} on a load balancer expires in under 14 days
          description: >-
            A certificate that a load balancer's forwarding rule terminates TLS with is
            within two weeks of expiry. This narrows DigitalOceanCertificateExpiringSoon
            to the certificates actually serving traffic: when it fires, expiry means TLS
            errors on a live frontend, not an unused certificate lapsing quietly. It joins
            the forwarding rules to the certificate inventory, so it needs both the
            loadbalancers collector and the certificates collector, which is off by
            default.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#certificates-and-firewalls

      - alert: DigitalOceanCertificateError
        expr: digitalocean_certificate_info{state="error"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Certificate {{ $labels.name }} is in the error state
          description: >-
            DigitalOcean reports the certificate's state as error, which for a
            lets_encrypt certificate means issuance or renewal failed — usually DNS no
            longer pointing where the domain validation expects. The certificate being
            served keeps working until its expiry, which is what makes this quiet: fixed
            now it costs nothing, ignored it becomes DigitalOceanCertificateExpiringSoon
            with two weeks left, and this fires as early as the failed renewal itself.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#certificates-and-firewalls

      - alert: DigitalOceanFirewallChangesPending
        expr: digitalocean_firewall_pending_changes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Firewall {{ $labels.name }} has changes that have not landed
          description: >-
            The ruleset has not reached every droplet, so the firewall is not protecting
            what it says it protects. This is normally zero within seconds of an edit.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#certificates-and-firewalls

      - alert: DigitalOceanFirewallOpenRulesChanged
        expr: changes(digitalocean_firewall_inbound_rules_open[1d]) > 0
        labels:
          severity: info
        annotations:
          summary: Firewall {{ $labels.name }} changed how much it exposes to the internet
          description: >-
            The number of inbound rules reachable from 0.0.0.0/0 or ::/0 moved in the last
            day. The count itself is not a fault — a public web server needs one — but an
            unexplained change is worth reading.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#certificates-and-firewalls

  - name: digitalocean-cost
    rules:
      - alert: DigitalOceanRegistryStorageNearQuota
        expr: >-
          digitalocean_registry_storage_usage_bytes
            / digitalocean_registry_storage_included_bytes > 0.9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Container registry {{ $labels.registry }} uses over 90% of its included storage
          description: >-
            Storage past the tier's allowance is billed on top of the subscription.
            Garbage-collect untagged manifests in {{ $labels.registry }} or move up a tier.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#cost

      - alert: DigitalOceanVolumeUnattached
        expr: digitalocean_volume_droplets == 0
        for: 24h
        labels:
          severity: info
        annotations:
          summary: Volume {{ $labels.name }} is attached to nothing
          description: >-
            DigitalOcean bills a volume by its allocated size for as long as it exists,
            attached or not. A day of this is usually a leftover from a deleted droplet
            or a released PersistentVolumeClaim.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#cost

      - alert: DigitalOceanReservedIPUnassigned
        expr: digitalocean_reserved_ip_assigned == 0
        for: 24h
        labels:
          severity: info
        annotations:
          summary: Reserved IP {{ $labels.ip }} is assigned to nothing
          description: >-
            DigitalOcean bills a reserved IP that is not assigned to a droplet, and only
            then. A day of this in {{ $labels.region }} is usually an address held after
            the droplet behind it was destroyed — either reassign it or release it.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#cost

      - alert: DigitalOceanSnapshotOld
        expr: >-
          (time() - digitalocean_image_created_timestamp_seconds{type="snapshot"})
            > 90 * 24 * 3600
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Snapshot {{ $labels.name }} is over ninety days old
          description: >-
            DigitalOcean bills a stored image by its size every month, forever, and a
            snapshot older than ninety days is usually one taken before a change nobody
            rolled back. Check whether {{ $labels.name }} ({{ $labels.id }}) is still
            worth keeping. Automatic droplet backups expire on their own and are not
            counted here.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#cost

      - alert: DigitalOceanDropletOff
        expr: digitalocean_droplet_info{status="off"} == 1
        for: 24h
        labels:
          severity: info
        annotations:
          summary: Droplet {{ $labels.name }} has been powered off for a day
          description: >-
            DigitalOcean bills a droplet by its size whether it runs or not, because the
            disk and the address stay reserved. A day of this is either a droplet
            somebody forgot to destroy or one waiting on a decision. It is the half
            DigitalOceanDropletDown leaves out, reported as a cost rather than a page.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#cost

      - alert: DigitalOceanSpacesBucketUnreachable
        expr: digitalocean_spaces_bucket_up == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Bucket {{ $labels.bucket }} could not be measured
          description: >-
            The bucket kept its previous size and object count. The usual cause is a
            Spaces key without read access to this bucket. Other buckets are unaffected.
          runbook_url: https://kozaktomas.github.io/digitalocean_exporter/latest/alerting/#cost
